services:
  mediclaim-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mediclaim-api
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - CLAIM_LLM_MODEL=${CLAIM_LLM_MODEL:-gemini-3.1-flash-lite}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - LANGFUSE_HOST=${LANGFUSE_HOST:-https://cloud.langfuse.com}
      - HF_HUB_OFFLINE=1
    volumes:
      - ./data/checkpoints.sqlite:/app/data/checkpoints.sqlite
      - ./data/mediclaim.db:/app/data/mediclaim.db
    restart: unless-stopped
